[build]
	command = "pnpm build"
	publish = "build"

[build.environment]
	# Netlify's build image provisions pnpm via Corepack (local dev doesn't
	# need Corepack — see README):
	# https://docs.netlify.com/build/configure-builds/manage-dependencies/#pnpm
	# pnpm 11 needs Corepack >= 0.34.5. "24" resolves to the newest 24.x
	# (24.21.0 bundles Corepack 0.36.0) and keeps taking patch releases; a
	# minor pin like "24.21" would freeze them. Node 24 is the last LTS that
	# bundles Corepack (Node >= 25 doesn't), so a move to 26 needs Netlify's
	# own pnpm provisioning to be settled first. Keep in step with
	# @types/node, CI (.github/actions/setup) and .mise.toml.
	NODE_VERSION = "24"

[images]
  remote_images = ["https://static.btcmap.org/images/.*", "https://www.openstreetmap.org/.*", "https://avatars.githubusercontent.com/.*" ]
