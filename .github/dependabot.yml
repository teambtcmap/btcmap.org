version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the runtime Node major (NODE_VERSION in
      # netlify.toml); a newer major types APIs Netlify doesn't run.
      # Raise this together with NODE_VERSION.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
    groups:
      # Every minor and patch bump lands in one weekly PR. A major gets a PR
      # of its own: it usually needs migration work and would hold up the
      # rest. Security updates ignore version-update groups and stay single.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # Workflows pin actions to a major tag, so these bumps are all majors,
      # but small ones: they share one PR as well
      actions:
        patterns: ['*']
