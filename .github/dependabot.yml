version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the runtime Node major (NODE_VERSION in
      # netlify.toml); a newer major types APIs Netlify doesn't run.
      # Raise this together with NODE_VERSION.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
    groups:
      biome:
        patterns:
          - '@biomejs/*'
      svelte:
        patterns:
          - 'svelte'
          - '@sveltejs/*'
          - 'svelte-*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      playwright:
        patterns:
          - '@playwright/*'
      leaflet:
        patterns:
          - 'leaflet'
          - 'leaflet-*'
          - '@maplibre/*'
          - 'maplibre-gl'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
