version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the runtime Node major (NODE_VERSION in
      # netlify.toml); a newer major types APIs Netlify doesn't run.
      # Raise this together with NODE_VERSION.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
    groups:
      # Every minor and patch bump lands in one weekly PR. A major gets a PR
      # of its own: it usually needs migration work and would hold up the
      # rest. Dependabot counts 0.5 -> 0.6 as a minor, though, so a breaking
      # 0.x bump rides in the group. Security updates skip this group.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    # '/' reaches only .github/workflows and a root action.yml; the
    # composite actions under .github/actions need their own entry.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # Workflows and composite actions pin actions to a major tag, so these
      # bumps are all majors, but small ones: they share one PR as well.
      actions:
        patterns: ['*']
