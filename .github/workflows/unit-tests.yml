name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          needs-env: 'true'
          needs-sync: 'true'

      - name: Run Vitest tests
        run: pnpm run test

      # The AI health review's chunking/validation scripts are plain
      # Python with no runtime deps — the runner's python3 is enough.
      - name: Run health-review pipeline script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
