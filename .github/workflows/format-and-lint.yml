name: Format and Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  # Merge queue entries build on a temporary merge-group ref — without
  # this trigger no checks report there and queued PRs time out.
  merge_group:

concurrency:
  group: format-and-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          needs-env: 'false'
          needs-sync: 'true'

      - name: Run Biome format check
        run: pnpm run format

      - name: Run Biome lint
        run: pnpm run lint

      # Fail if the committed offline icon bundle is stale — e.g. a new
      # materialExceptions entry or <Icon> usage landed without regenerating.
      # Deterministic from the committed vocabulary + pinned icon-set packages;
      # `icons:refresh` (not this) is what rescans the places feed.
      - name: Verify the icon bundle is up to date
        run: |
          pnpm run icons:generate
          # Capture the exact status: git diff --exit-code returns 1 for a real
          # diff (stale bundle) but other codes (e.g. 128) for a git failure —
          # only the former should point the dev at `icons:generate`.
          status=0
          git diff --exit-code src/lib/icons/generated || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error title=Icon bundle out of date::A new <Icon> usage or materialExceptions entry changed the generated icons (diff above). Fix: run 'pnpm icons:generate' locally and commit src/lib/icons/generated/."
          fi
          exit "$status"
