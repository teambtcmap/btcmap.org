name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          needs-env: 'true'
          needs-sync: 'true'

      # .env.example ships empty captcha keys, which leaves /captcha broken
      # and every captcha-gated form control permanently disabled — specs
      # that interact with those controls need working (throwaway) keys.
      - name: Generate captcha crypto keys
        run: |
          echo "SERVER_CRYPTO_KEY=$(openssl rand -hex 32)" >> .env
          echo "SERVER_INIT_VECTOR=$(openssl rand -hex 16)" >> .env

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm playwright install --with-deps chromium

      - name: Install Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm playwright install-deps

      - name: Run Playwright tests
        run: pnpm playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
